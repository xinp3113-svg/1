<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <title>联系方式</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: linear-gradient(180deg, #f5f7fb 0%, #eef2f7 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: #111827;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 38px 30px 30px;
      background: rgba(255,255,255,.96);
      border: 1px solid rgba(17,24,39,.06);
      border-radius: 22px;
      box-shadow: 0 18px 55px rgba(15,23,42,.10);
      text-align: center;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      background: #111827;
      color: white;
      font-size: 28px;
      font-weight: 700;
    }
    h1 { margin: 0; font-size: 24px; font-weight: 700; }
    .tip { margin: 10px 0 24px; color: #6b7280; font-size: 14px; }
    .qq {
      margin: 0 0 22px;
      padding: 17px 16px;
      border-radius: 14px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      font-size: 29px;
      font-weight: 800;
      letter-spacing: 1px;
      word-break: break-all;
      user-select: all;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    #status { min-height: 20px; margin-top: 14px; color: #16a34a; font-size: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">QQ</div>
    <h1>联系方式</h1>
    <div class="tip">复制 QQ 号后添加即可</div>
    <div class="qq" id="qq">2425461283</div>
    <button type="button" onclick="copyQQ()">复制 QQ 号</button>
    <div id="status"></div>
  </main>
  <script>
    async function copyQQ() {
      const qq = "2425461283";
      const status = document.getElementById("status");
      try {
        await navigator.clipboard.writeText(qq);
        status.textContent = "已复制： " + qq;
      } catch (e) {
        const textarea = document.createElement("textarea");
        textarea.value = qq;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        status.textContent = "已复制： " + qq;
      }
    }
  </script>
</body>
</html>
